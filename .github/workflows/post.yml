name: Make posts

on:
  # Add a post file to posts/queue/ and push: the post is fetched, cut out,
  # rendered and committed to posts/<name>/
  push:
    paths:
      - "posts/queue/*.json"
      - "music/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images  # shared with the Fetch images workflow so pushes never race
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-birefnet-portrait-v1

      - name: Install tools
        run: |
          pip install --quiet "rembg[cpu]" opencv-python-headless pillow numpy
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Make posts
        run: |
          set -o pipefail
          python make_posts.py 2>&1 | tee posts/make-posts-log.txt

      - name: Commit posts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A posts images
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Make posts"
          git pull --rebase
          git push
